<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Health Care System</title>
    <style>
      body {
        background-image: url("Hero 1.png");
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        height: 100vh;
        margin: 0;
      }
    </style>
    <style>
      .title {
        text-align: center;
      }
    </style>
    <style>
      .white-text {
        color: white;
      }
    </style>
    <style>
      body {
        background-image: url("Hero 1.png");
      }
    </style>
    <style>
      .custom-font {
        font-family: "Italiana", sans-serif;
      }
    </style>
    <style>
      .container {
        text-align: center;
        margin-top: 100px;
      }

      button {
        padding: 5px 20px;
        margin: 10px;
        border-radius: 5px;
      }
    </style>
    <style>
      .image-container {
        text-align: center;
      }

      img {
        width: 500px;
        border-radius: 10px;
        margin-top: 30px;
      }
    </style>
    <style>
      .login-box {
        text-align: center;
        margin-top: 100px;
      }

      input {
        padding: 10px;
        width: 250px;
        margin: 10px;
        border-radius: 5px;
        border: 1px solid gray;
      }

      button {
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        background-color: whitesmoke;
        color: grey;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1 class="title white-text custom-font">
      Welcome to the Health Care System
    </h1>
    <div class="login-box">
      <input type="text" placeholder="Username" /><br />
      <input type="password" placeholder="Password" /><br />
      <button>Login</button>
    </div>
    <div class="image-container">
      <img src="H Img.png" alt="Photo" />
    </div>
  </body>
</html>
